# Local DuckDB profile — no credentials, runs anywhere.
# dbt looks for this at ~/.dbt/profiles.yml; it is committed here so the
# project works out of the box (copy it there or set DBT_PROFILES_DIR=. ).
dbt_retail_analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: dev.duckdb
      schema: main
